services:
  - type: web
    name: chaveirocar-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /pronto
    autoDeploy: true
    envVars:
      - key: AMBIENTE
        value: producao
      - key: URL_PUBLICA
        sync: false
      - key: TURSO_URL
        sync: false
      - key: TURSO_TOKEN
        sync: false
      - key: STORAGE_TIPO
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGIAO
        value: us-east-005
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: SMTP_URL
        sync: false
      - key: EMAIL_REMETENTE
        sync: false
      - key: ORIGENS_PERMITIDAS
        sync: false
      - key: EXPOR_TOKEN_DEV
        value: "false"
