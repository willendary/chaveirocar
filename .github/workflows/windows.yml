name: Windows CI

on:
  push:
    paths:
      - "windows/**"
      - "contracts/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - "contracts/**"
      - ".github/workflows/windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Compilar
        run: dotnet build windows/ChaveiroCar.Windows/ChaveiroCar.Windows.csproj -c Release
      - name: Validar pacote autocontido
        run: dotnet publish windows/ChaveiroCar.Windows/ChaveiroCar.Windows.csproj -c Release -r win-x64 --self-contained true -o publish
