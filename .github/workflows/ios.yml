name: iOS CI

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Compilar pacote Swift (ChaveiroCarCore + ChaveiroCarApp)
        run: swift build
      - name: Executar testes unitarios iOS/macOS
        run: swift test
