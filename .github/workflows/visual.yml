name: Visual e navegacao
on:
  push:
    branches: [main, 'design/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar e testar
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Habilitar aceleracao do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Conferir telas e fluxos em celular e tablet
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell wm size 1080x1920
            adb shell wm density 480
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.perfil=celular
            mkdir -p capturas
            adb pull /sdcard/Android/data/com.willendary.chaveirocar/files/screenshots/ capturas/
            adb shell wm size 1600x2560
            adb shell wm density 320
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.perfil=tablet
            adb pull /sdcard/Android/data/com.willendary.chaveirocar/files/screenshots/ capturas/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revisao-visual
          path: |
            capturas/
            app/build/reports/androidTests/
            app/build/reports/tests/
