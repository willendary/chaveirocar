name: Android APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Visual e navegacao"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configurar assinatura
        env:
          CHAVEIRO_KEYSTORE_BASE64: ${{ secrets.CHAVEIRO_KEYSTORE_BASE64 }}
          CHAVEIRO_KEYSTORE_SENHA: ${{ secrets.CHAVEIRO_KEYSTORE_SENHA }}
          CHAVEIRO_KEY_ALIAS: ${{ secrets.CHAVEIRO_KEY_ALIAS }}
          CHAVEIRO_KEY_SENHA: ${{ secrets.CHAVEIRO_KEY_SENHA }}
        run: |
          echo "$CHAVEIRO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/chaveirocar.jks"
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "CHAVEIRO_KEYSTORE=$RUNNER_TEMP/chaveirocar.jks"
            echo "CHAVEIRO_KEYSTORE_SENHA=$CHAVEIRO_KEYSTORE_SENHA"
            echo "CHAVEIRO_KEY_ALIAS=$CHAVEIRO_KEY_ALIAS"
            echo "CHAVEIRO_KEY_SENHA=$CHAVEIRO_KEY_SENHA"
          } > local.properties

      - name: Testes unitarios
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Gerar APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Nomear APK
        run: |
          mkdir -p dist
          versao=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          echo "APP_VERSION=$versao" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "dist/chaveirocar-${versao}.apk"

      - name: Guardar APK do build
        uses: actions/upload-artifact@v4
        with:
          name: chaveirocar-apk
          path: dist/*.apk

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ChaveiroCar ${{ github.ref_name }}
          files: dist/*.apk
          generate_release_notes: true

      - name: Publicar versao validada na main
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notas="release/v${APP_VERSION}.md"
          if [ ! -f "$notas" ]; then
            echo "Sem notas de publicacao para esta versao."
            exit 0
          fi
          if gh release view "v${APP_VERSION}" >/dev/null 2>&1; then
            echo "Versao ja publicada."
            exit 0
          fi
          gh release create "v${APP_VERSION}" dist/*.apk --target "$(git rev-parse HEAD)" --title "ChaveiroCar ${APP_VERSION}" --notes-file "$notas"
