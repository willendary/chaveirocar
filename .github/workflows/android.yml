name: Releases Android + Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configurar assinatura
        env:
          CHAVEIRO_KEYSTORE_BASE64: ${{ secrets.CHAVEIRO_KEYSTORE_BASE64 }}
          CHAVEIRO_KEYSTORE_SENHA: ${{ secrets.CHAVEIRO_KEYSTORE_SENHA }}
          CHAVEIRO_KEY_ALIAS: ${{ secrets.CHAVEIRO_KEY_ALIAS }}
          CHAVEIRO_KEY_SENHA: ${{ secrets.CHAVEIRO_KEY_SENHA }}
        run: |
          echo "$CHAVEIRO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/chaveirocar.jks"
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "CHAVEIRO_KEYSTORE=$RUNNER_TEMP/chaveirocar.jks"
            echo "CHAVEIRO_KEYSTORE_SENHA=$CHAVEIRO_KEYSTORE_SENHA"
            echo "CHAVEIRO_KEY_ALIAS=$CHAVEIRO_KEY_ALIAS"
            echo "CHAVEIRO_KEY_SENHA=$CHAVEIRO_KEY_SENHA"
          } > local.properties

      - name: Testes unitarios
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Gerar APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Nomear APK
        run: |
          mkdir -p dist
          versao=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          echo "APP_VERSION=$versao" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "dist/chaveirocar-${versao}.apk"

      - name: Guardar APK do build
        uses: actions/upload-artifact@v4
        with:
          name: chaveirocar-apk
          path: dist/*.apk

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ChaveiroCar ${{ github.ref_name }}
          files: dist/*.apk
          generate_release_notes: true

  windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: windows-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publicar Windows x64 autocontido
        run: dotnet publish windows/ChaveiroCar.Windows/ChaveiroCar.Windows.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Compactar pacote portátil
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path publish/* -DestinationPath dist/chaveirocar-windows-x64.zip -Force

      - name: Guardar pacote Windows
        uses: actions/upload-artifact@v4
        with:
          name: chaveirocar-windows-x64
          path: dist/chaveirocar-windows-x64.zip

      - name: Anexar Windows à release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/chaveirocar-windows-x64.zip
