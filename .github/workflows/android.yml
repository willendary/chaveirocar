name: Releases Android + Windows

on:
  push:
    tags: ["v*"]
    branches: ["release/v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.versao.outputs.tag }}
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Conferir versao da publicacao
        id: versao
        shell: bash
        run: |
          versao=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          tag="v$versao"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -f "release/$tag.md"
          if [[ "$GITHUB_REF" == refs/tags/* || "$GITHUB_REF" == refs/heads/release/* ]]; then
            test "${GITHUB_REF##*/}" = "$tag"
            existente=$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}" | tail -1 | cut -f1)
            if [[ -n "$existente" && "$existente" != "$GITHUB_SHA" ]]; then
              echo "A tag $tag ja aponta para outro commit. Incremente a versao."
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configurar assinatura
        env:
          CHAVEIRO_KEYSTORE_BASE64: ${{ secrets.CHAVEIRO_KEYSTORE_BASE64 }}
          CHAVEIRO_KEYSTORE_SENHA: ${{ secrets.CHAVEIRO_KEYSTORE_SENHA }}
          CHAVEIRO_KEY_ALIAS: ${{ secrets.CHAVEIRO_KEY_ALIAS }}
          CHAVEIRO_KEY_SENHA: ${{ secrets.CHAVEIRO_KEY_SENHA }}
        run: |
          echo "$CHAVEIRO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/chaveirocar.jks"
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "CHAVEIRO_KEYSTORE=$RUNNER_TEMP/chaveirocar.jks"
            echo "CHAVEIRO_KEYSTORE_SENHA=$CHAVEIRO_KEYSTORE_SENHA"
            echo "CHAVEIRO_KEY_ALIAS=$CHAVEIRO_KEY_ALIAS"
            echo "CHAVEIRO_KEY_SENHA=$CHAVEIRO_KEY_SENHA"
          } > local.properties

      - name: Testes unitarios
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Gerar APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Nomear APK
        run: |
          mkdir -p dist
          versao=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          echo "APP_VERSION=$versao" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "dist/chaveirocar-${versao}.apk"

      - name: Guardar APK do build
        uses: actions/upload-artifact@v4
        with:
          name: chaveirocar-apk
          path: dist/*.apk

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versao.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ChaveiroCar ${{ steps.versao.outputs.tag }}
          body_path: release/${{ steps.versao.outputs.tag }}.md
          files: dist/*.apk

  windows:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: windows-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publicar Windows x64 executável único
        run: dotnet publish windows/ChaveiroCar.Windows/ChaveiroCar.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish

      - name: Preparar executável único e pacote portátil
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path windows/ChaveiroCar.Windows/publish | Out-Null
          Copy-Item publish/ChaveiroCar.Windows.exe dist/ChaveiroCar.Windows.exe -Force
          Copy-Item publish/ChaveiroCar.Windows.exe windows/ChaveiroCar.Windows/publish/ChaveiroCar.Windows.exe -Force
          Compress-Archive -Path publish/ChaveiroCar.Windows.exe -DestinationPath dist/chaveirocar-windows-x64.zip -Force

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress

      - name: Compilar Instalador Windows (Setup.exe)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows/installer/chaveirocar.iss

      - name: Guardar pacote Windows
        uses: actions/upload-artifact@v4
        with:
          name: chaveirocar-windows-x64
          path: |
            dist/ChaveiroCar.Windows.exe
            dist/ChaveiroCar-Setup.exe
            dist/chaveirocar-windows-x64.zip

      - name: Anexar Windows à release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: release/${{ needs.build.outputs.tag }}.md
          files: |
            dist/ChaveiroCar.Windows.exe
            dist/ChaveiroCar-Setup.exe
            dist/chaveirocar-windows-x64.zip
